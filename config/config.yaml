# `tmp_dir`
tmp_dir: "/work/aaa/tmp"

## INPUTS

# `genome`
# FASTA file
# Defines the reference seqeunces
genome:
  file: "resources/genome/hg38.fa"
  url: "https://www.encodeproject.org/files/GRCh38_no_alt_analysis_set_GCA_000001405.15/@@download/GRCh38_no_alt_analysis_set_GCA_000001405.15.fasta.gz"

# `chrom_sizes`
# TSV file
# Defines the chromosome sizes for the reference genome
chrom_sizes:
  file: "resources/genome/hg38.chrom.sizes"
  url: "https://www.encodeproject.org/files/GRCh38_EBV.chrom.sizes/@@download/GRCh38_EBV.chrom.sizes.tsv"

# `blacklist_regions`
# BED file
# Defines the blacklisted regions for the reference genome
blacklist_regions:
  file: "resources/genome/hg38.blacklist.bed.gz"
  url: "https://www.encodeproject.org/files/ENCFF356LFX/@@download/ENCFF356LFX.bed.gz"

# `pretrained_bias`
# info for downloading a pretrained bias
pretrained_bias:
  url: "https://zenodo.org/records/7443683/files/bias_models.zip?download=1"
  filepath: "bias_models/ATAC/ENCSR868FGK_bias_fold_0.h5"
  outdir: "resources/bias/pretrained"
  h5: "resources/bias/pretrained/ENCSR868FGK_bias_fold_0.h5"

# `meme`
# MEME file
# Defines the MEME database to query against
meme:
  file: "resources/meme/H13CORE_meme_format.meme"
  url: "https://hocomoco13.autosome.org/final_bundle/hocomoco13/H13CORE/formatted_motifs/H13CORE_meme_format.meme"
  json: "https://hocomoco13.autosome.org/final_bundle/hocomoco13/H13CORE/H13CORE_annotation.jsonl"

