blacklist_expand_width: 1057

folds:
  fold_0: "https://zenodo.org/record/7445373/files/fold_0.json?download=1"
  fold_1: "https://zenodo.org/record/7445373/files/fold_1.json?download=1"
  fold_2: "https://zenodo.org/record/7445373/files/fold_2.json?download=1"
  fold_3: "https://zenodo.org/record/7445373/files/fold_3.json?download=1"
  fold_4: "https://zenodo.org/record/7445373/files/fold_4.json?download=1"

peaks:
  gsize: "hs"
  max_peaks: 300000
  pval_thresh: 0.01
  smooth_window: 150

modisco:
  num_matches: 10
  num_seqlets: 1000000
  window: 500

finemo:
  # `cwm_trim_threshold`
  # The threshold to determine motif start and end positions within the full CWMs. Default is 0.3.
  cwm_trim_threshold: 0.3
  # `alpha`
  # The L1 regularization weight. Default is 0.7.
  alpha: 0.7
  # `batch_size`
  # The batch size used for optimization. Default is 2000.
  batch_size: 2000
  # `extra_args`
  # Variable to pass an extra arguments. E.g. "-J/--compile" enables JIT compilation for faster execution.
  extra_args: "-J"
